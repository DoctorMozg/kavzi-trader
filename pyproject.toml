[project]
name = "kavzitrader"
version = "0.1.0"
description = "Personal research project exploring the trading capabilities of LLMs: a Brain-Spine crypto trading platform for Binance with tiered PydanticAI agents."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Stanislav Gonorovskii", email = "drmozg@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
    "Intended Audience :: Developers",
]

dependencies = [
    "click>=8.5.1",
    "dateparser>=1.5.0",
    "httpx2>=2.12.0",
    "jinja2>=3.1.6",
    "openai>=3.51.0",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "pydantic-ai-slim[openai]>=2.68.0",
    "python-binance>=1.0.37",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
    "websockets>=15",
]

[project.scripts]
kavzitrader = "kavzi_trader.cli.main:cli"

[project.urls]
Homepage = "https://github.com/doctormozg/kavzi-trader"
Issues = "https://github.com/doctormozg/kavzi-trader/issues"

[build-system]
requires = ["uv_build>=0.11.13,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kavzi_trader"
module-root = ""

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "types-dateparser>=1.2.2.20250809",
    "types-pyyaml>=6.0.12.20261113",
]


[tool.pytest.ini_options]
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s [%(levelname)s] %(filename)s:%(lineno)s %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

testpaths = [
    "tests",
]


[tool.ruff]
# Same as Black.
line-length = 88
indent-width = 4

target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "TD",
    "FIX",
    "S311",
    "S603",
    "S608", # TODO: Remove this
    "PLR0913",
    "PGH003",
    "PTH123",
    "PTH118",
    "PTH119",
    "TRY003",
    "EM101",
    "EM102",
    "FBT003",
    "FBT001",
    "TC001",
    "TC002",
    "G004",
    "FBT002",
    "COM812",
    "TC003",
    "PLC0415",
    "ASYNC110",
    "PLR0915",
    "C901",
    "PLW0108",
    "CPY001",
    "PLR0917",
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"**/{tests,docs,tools}/*" = ["S101", "S106", "S108", "SLF001", "PLR0913", "TRY301", "PT011", "ANN", "ARG", "PTH", "PERF", "PLR2004", "S110", "BLE001"]
"**/{scripts,examples}/*" = ["T201", "S607"]


[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_no_return = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_untyped_defs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disable_error_code = ["method-assign", "attr-defined", "call-arg"]
