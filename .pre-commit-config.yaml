# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
exclude: ^(scripts/|alembic/versions/)
repos:
  - repo: meta
    hooks:
      - id: identity

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
        types: [python]
      - id: ruff-format
        types_or: [python, pyi]

  # Runs in the project venv so third-party types (pydantic-ai, openai, redis) are checked.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --with mypy==2.4.1 mypy --config-file pyproject.toml
        language: system
        types: [python]
        require_serial: true
